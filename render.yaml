services:
  - type: web
    name: the-planet-hackathon
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: node scripts/node-server.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PNPM_VERSION
        value: 10.33.2
      - key: VITE_GEMINI_API_KEY
        sync: false  # set in the Render dashboard; needed by the GPT-9000 terminal

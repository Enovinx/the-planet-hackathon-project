<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The Paradox Protocol — Thumbnail</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Space Mono", "Courier New", ui-monospace, monospace;
  }
  .card {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    background: #000;
    border: 8px solid #fff;
    box-shadow: 16px 16px 0 #fff;
    flex-shrink: 0;
  }
  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
    opacity: 0.35;
  }
  .fade {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0.15) 100%);
  }
  .content {
    position: absolute;
    inset: 0;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
  }
  .kicker {
    color: #a1a1aa;
    font-size: 22px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
  }
  h1 {
    color: #fff;
    font-size: 92px;
    line-height: 0.95;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .tag {
    color: #fff;
    font-size: 26px;
    letter-spacing: 0.06em;
    border-left: 6px solid #fff;
    padding-left: 20px;
  }
  .row {
    display: flex;
    gap: 16px;
    margin-top: 12px;
  }
  .chip {
    border: 3px solid #fff;
    color: #fff;
    font-size: 18px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 10px 18px;
  }
  .chip.solid { background: #fff; color: #000; }
  .ship {
    position: absolute;
    right: 72px;
    top: 50%;
    transform: translateY(-50%);
    width: 300px;
    image-rendering: pixelated;
  }
  .o2 {
    position: absolute;
    right: 72px;
    bottom: 56px;
    border: 3px solid #fff;
    color: #fff;
    font-size: 22px;
    letter-spacing: 0.2em;
    padding: 8px 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="bg" src="public/assets/control-panel.png" alt="" />
    <div class="fade"></div>
    <div class="content">
      <div class="kicker">Lost astronaut // Escape game</div>
      <h1>The<br />Paradox<br />Protocol</h1>
      <div class="tag">Talk your killer ship into letting you live.</div>
      <div class="row">
        <div class="chip solid">GPT-9000 duel</div>
        <div class="chip">4 stations</div>
        <div class="chip">Escape run</div>
      </div>
    </div>
    <img class="ship" src="public/assets/ship/Main%20Ship%20-%20Base%20-%20Full%20health.png" alt="" />
    <div class="o2">O2 80%</div>
  </div>
</body>
</html>
